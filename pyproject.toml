[project]
name = "localmcplib"
version = "0.1.3"
description = "Reusable foundations for local stdio MCP servers."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Demian Brecht", email = "dbrecht@salesforce.com" }]
maintainers = [{ name = "Demian Brecht", email = "dbrecht@salesforce.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/salesforce-misc/localmcplib"
Repository = "https://github.com/salesforce-misc/localmcplib"
Issues = "https://github.com/salesforce-misc/localmcplib/issues"

[project.optional-dependencies]
secrets = ["keyring>=25.7.0"]
llm = [
    "httpx2>=2.13.0",
    "langchain-anthropic>=1.7.2",
    "langchain-openai>=1.6.3",
]
sandbox = ["langchain-core>=1.6.4", "pydantic>=2.13.5"]
observability = ["structlog>=26.1.0"]
telemetry = [
    "fastmcp>=4.0.5",
    "langfuse>=4.15.4,<5",
    "structlog>=26.1.0",
]
server = [
    "fastmcp>=4.0.5",
    "httpx2>=2.13.0",
    "keyring>=25.7.0",
    "langchain-anthropic>=1.7.2",
    "langchain-openai>=1.6.3",
    "structlog>=26.1.0",
]
workflows = [
    "aiosqlite>=0.22.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "structlog>=26.1.0",
]
all = [
    "aiosqlite>=0.22.1",
    "fastmcp>=4.0.5",
    "httpx2>=2.13.0",
    "keyring>=25.7.0",
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.3",
    "langfuse>=4.15.4,<5",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "localmcp"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/localmcp"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true
